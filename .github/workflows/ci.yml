name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Tes situs, lint, manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      # Sama dengan phpunit.xml: tanpa database nyata; perintah artisan lain (lint/manifest) memakai nilai ini juga.
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      # Repositori path "../" (jo/devlib) memakai symlink relatif terhadap akar repo hasil checkout.
      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env
      - run: php artisan key:generate

      # Tidak ada package-lock.json di repo: npm ci tidak bisa. .npmrc sudah ignore-scripts=true.
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - run: php artisan test
      - run: php artisan devlib:lint
      - run: php artisan devlib:manifest --check
